- repeat: 1
  data:
    name: nyc
    meta:
      - type: trip
  models:
    - name: transformer_encoder
      config:
        d_model: 128
        num_heads: 8 
        num_layers: 4
        output_size: 128
        con_feats: [0, 3, 4, 7]         # tod, lng, lat, seconds
        dis_feats: [1, 2, 5, 6]         # road, road_prop, weekday, seq_i
        num_embeds: [9989, 1, 7, 190]  # 用实际npz统计 ./test.py统计，pretrain的num_embeds也要改
    - name: transformer_decoder
      config:
        encode_size: 128
        d_model: 128
        hidden_size: 256
        num_layers: 2
        num_heads: 8
  pretrain:
    load: true
    load_path: /home/pshao8/poi/UniTE-main/cache/model_save/generative_b16-lr0.001_enc0-rec0/AutoReg_fv1_latent128_dis-1.0-1,2,5,6_con-1.0-0,3,4,7/nyc_trip/Transformer-1,2,5,6,0,3,4,7-d128-h128-l4-h8-pass_TransDecoder-d128-h256-l2-h8/Transformer-1,2,5,6,0,3,4,7-d128-h128-l4-h8-pass.model  # 你的实际权重文件
    loss:
      name: autoreg
      config:
        out_dis:
          feats: [1, 2, 5, 6]
          num_embeds: [9989, 1, 7, 190]
        out_con_feats: [0, 3, 4, 7]
        latent_size: 128
        dis_weight: 1.0
        con_weight: 1.0
    trainer:
      name: generative
      config:
        num_epoch: 300
        batch_size: 16
        lr: 1.0e-3
        enc_meta_i: [0]
        rec_meta_i: [0]
  # downstream: []
  downstream:
    - task: search
      select_models: [0]
      config:
        batch_size: 64
        num_epoch: 1
        lr: 0.001
      predictor: {}
      eval_set: 2   # 2 代表 test 集，0/1 分别是 train/val